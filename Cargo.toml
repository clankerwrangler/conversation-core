[package]
name = "conversation-core"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "core"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
sha2 = "0.10"
ureq = "3"
# Codex's WebSocket transport, as the harness uses it.
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Skill frontmatter, as pi reads it.
serde_yaml = "0.9"
# Built-in tools (pi 1.5's read, bash, edit, write, grep, find, ls).
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2"
regex-syntax = "0.8"
similar = "2"
unicode-normalization = "0.1"

[lints.clippy]
all = { level = "warn", priority = -1 }
